# 赛题 1 视觉参数（ROI 内 HSV 颜色比例 + 亮度兜底）。
# 现场调参后写入；不存在的键会沿用代码内置默认。
# 灯的像素 ROI 不在此文件，在 site.yaml 的 panel.lamps[].roi。

min_area_ratio: 0.10     # ROI 内命中灯颜色的像素比例阈值
bright_mean_min: 140     # 亮度兜底：ROI 灰度均值阈值（0-255）
minimum_winner_margin: 1.2  # 并列拒绝：前两名得分差下限（相对阈值倍数；反光两灯同亮时拒动）

colors:
  red:    [[[0, 90, 80], [10, 255, 255]], [[170, 90, 80], [180, 255, 255]]]
  yellow: [[[20, 90, 80], [35, 255, 255]]]
  green:  [[[40, 70, 70], [85, 255, 255]]]
